name: Escaneo diario

on:
  schedule:
    # 22:30 UTC de lunes a viernes: cierre de EE.UU. ya consolidado.
    # GitHub retrasa los cron en horas punta; no cuentes con el minuto exacto.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      rebuild_universe:
        description: "Reconstruir el universo de activos"
        type: boolean
        default: false
      limit:
        description: "Limitar nº de símbolos (0 = todos)"
        default: "0"

permissions:
  contents: write      # necesario para desempaquetar el código desde el zip
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # el límite duro de un job es 6 h
    steps:
      - uses: actions/checkout@v4

      # Se admite CUALQUIER fichero qscan*.zip en la raíz y gana el que lleve el
      # número de VERSION más alto. El nombre deja de importar: subir
      # qscan-v3.zip junto al viejo qscan.zip funciona, y un zip antiguo no puede
      # pisar a uno nuevo aunque se suba después. Antes, con el nombre fijo
      # qscan.zip, era imposible distinguir versiones desde el móvil.
      # Se excluye .github/ a propósito: el GITHUB_TOKEN no puede escribir
      # ficheros de workflow, así que este fichero lo mantienes tú a mano.
      - name: Desempaquetar la versión más reciente
        run: |
          BEST=""; BESTV=-1
          for z in qscan*.zip; do
            [ -e "$z" ] || continue
            v=$(unzip -p "$z" VERSION 2>/dev/null | tr -dc '0-9')
            v=${v:-0}
            echo "  encontrado $z -> VERSION ${v}"
            if [ "$v" -gt "$BESTV" ]; then BESTV=$v; BEST=$z; fi
          done
          CUR=$( [ -f .qscan_version ] && cat .qscan_version || echo 0 )
          echo "versión instalada: $CUR · mejor disponible: $BESTV ($BEST)"
          if [ -n "$BEST" ] && [ "$BESTV" -gt "$CUR" ]; then
            echo "actualizando a la versión $BESTV desde $BEST"
            unzip -q -o "$BEST" -d _unpack
            rm -rf _unpack/.github
            cp -r _unpack/. .
            rm -rf _unpack
            echo "$BESTV" > .qscan_version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Actualizar qscan a la versión $BESTV" || true
            git push || echo "aviso: no se pudo commitear; se sigue con los ficheros en disco"
          elif [ -z "$BEST" ]; then
            echo "ERROR: no hay ningún qscan*.zip en la raíz del repositorio" >&2
            exit 1
          else
            echo "el código ya está en la versión $CUR"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El almacén de precios vive en la caché, no en el repo: son cientos de MB
      # que no tiene sentido versionar. La clave rota a diario y se restaura
      # desde la más reciente disponible, de modo que la descarga es incremental.
      - name: Restaurar almacén de precios
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: qscan-store-${{ github.run_id }}
          restore-keys: |
            qscan-store-

      - name: Construir universo
        if: inputs.rebuild_universe || steps.cache.outputs.cache-matched-key == ''
        run: python -m qscan.cli universe --out data/universe.csv
        env:
          PYTHONPATH: src

      # El límite se puede fijar de tres formas, por orden de prioridad:
      #   1. el campo del formulario al lanzar el workflow a mano
      #   2. la variable de repositorio QSCAN_LIMIT (Settings -> Variables)
      #   3. 0 = universo completo
      - name: Actualizar cotizaciones
        run: python -m qscan.cli update --years 8 --limit ${{ inputs.limit || vars.QSCAN_LIMIT || 0 }}
        env:
          PYTHONPATH: src

      - name: Calcular features y scores
        run: python -m qscan.cli scan --freq ME --history-months 96
        env:
          PYTHONPATH: src

      - name: Validación walk-forward
        run: python -m qscan.cli validate --cost-bps 10
        env:
          PYTHONPATH: src

      # La capa de comentario usa la API de Anthropic si existe el secreto
      # ANTHROPIC_API_KEY. Sin él, el informe sale igual con textos deterministas:
      # es una comodidad, no una dependencia.
      - name: Generar informe
        run: python -m qscan.cli report --top 40 --comment-top 15
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Guardar almacén actualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: qscan-store-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            out/*.parquet
            out/verdict.csv
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publish:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
