name: Escaneo diario

on:
  schedule:
    # Principal: 01:00 UTC de martes a sábado. Ojo con los días: en UTC, el
    # cierre del lunes cae ya en la madrugada del martes, así que la ventana
    # 2-6 (mar-sáb) es la que cubre las sesiones de lunes a viernes.
    # Se elige esta hora y no justo tras el cierre para que Yahoo haya
    # consolidado los precios ajustados, que tardan un rato en asentarse.
    - cron: "0 1 * * 2-6"
    # Reintento: 05:00 UTC. NO es un segundo escaneo. Si la ejecución principal
    # terminó bien, este se salta solo en unos segundos. Existe porque la
    # descarga depende de Yahoo, que limita el ritmo y falla de vez en cuando:
    # sin esta red, un fallo puntual te deja sin informe hasta el día siguiente.
    - cron: "0 5 * * 2-6"
  workflow_dispatch:
    inputs:
      rebuild_universe:
        description: "Reconstruir el universo de activos"
        type: boolean
        default: false
      limit:
        description: "Limitar nº de símbolos (0 = todos)"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  # Decide si hay algo que hacer. Se separa en su propio job para no tener que
  # colgar un "if" de cada uno de los catorce pasos del escaneo.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          HOY=$(date -u +%F)
          ULT=$( [ -f .last_success ] && cat .last_success || echo nunca )
          echo "hoy (UTC): $HOY · último escaneo correcto: $ULT"
          if [ "${{ github.event.schedule }}" = "0 5 * * 2-6" ] && [ "$ULT" = "$HOY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "la ejecución principal de hoy fue bien: no hace falta reintento"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # Se admite CUALQUIER fichero qscan*.zip en la raíz y gana el que lleve el
      # número de VERSION más alto. El nombre deja de importar.
      - name: Desempaquetar la versión más reciente
        run: |
          BEST=""; BESTV=-1
          for z in qscan*.zip; do
            [ -e "$z" ] || continue
            v=$(unzip -p "$z" VERSION 2>/dev/null | tr -dc '0-9')
            v=${v:-0}
            echo "  encontrado $z -> VERSION ${v}"
            if [ "$v" -gt "$BESTV" ]; then BESTV=$v; BEST=$z; fi
          done
          CUR=$( [ -f .qscan_version ] && cat .qscan_version || echo 0 )
          echo "versión instalada: $CUR · mejor disponible: $BESTV ($BEST)"
          if [ -n "$BEST" ] && [ "$BESTV" -gt "$CUR" ]; then
            echo "actualizando a la versión $BESTV desde $BEST"
            unzip -q -o "$BEST" -d _unpack
            rm -rf _unpack/.github
            cp -r _unpack/. .
            rm -rf _unpack
            echo "$BESTV" > .qscan_version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Actualizar qscan a la versión $BESTV" || true
            git push || echo "aviso: no se pudo commitear; se sigue con los ficheros en disco"
          elif [ -z "$BEST" ]; then
            echo "ERROR: no hay ningún qscan*.zip en la raíz del repositorio" >&2
            exit 1
          else
            echo "el código ya está en la versión $CUR"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar almacén de precios
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: qscan-store-${{ github.run_id }}
          restore-keys: |
            qscan-store-

      - name: Construir universo
        if: inputs.rebuild_universe || steps.cache.outputs.cache-matched-key == ''
        run: python -m qscan.cli universe --out data/universe.csv
        env:
          PYTHONPATH: src

      - name: Actualizar cotizaciones
        run: python -m qscan.cli update --years 8 --limit ${{ inputs.limit || vars.QSCAN_LIMIT || 0 }}
        env:
          PYTHONPATH: src

      - name: Calcular features y scores
        run: python -m qscan.cli scan --freq ME --history-months 96
        env:
          PYTHONPATH: src

      - name: Validación walk-forward
        run: python -m qscan.cli validate --cost-bps 10
        env:
          PYTHONPATH: src

      - name: Generar informe
        run: python -m qscan.cli report --top 40 --comment-top 15
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Marca de éxito. Es lo que lee el preflight para saber si el reintento de
      # las 05:00 tiene algo que hacer. Se escribe sólo si todo lo anterior fue
      # bien, que es justo la condición que interesa.
      - name: Marcar la ejecución como correcta
        run: |
          date -u +%F > .last_success
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_success
          git commit -m "Escaneo correcto $(date -u +%F)" || true
          git push || echo "aviso: no se pudo registrar la marca de éxito"

      - name: Guardar almacén actualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: qscan-store-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            out/*.parquet
            out/verdict.csv
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publish:
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
